name: Veille Paris Tennis Padel

on:
  workflow_dispatch:   # déclenché toutes les 2 min par cron-job.org

permissions:
  contents: write

concurrency:
  group: veille
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Passage de surveillance
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          ALERTES: ${{ secrets.ALERTES }}
          SPORT: "1"
          PASSES: "1"
        run: python watcher.py

      - name: Enregistrer les données
        if: always()
        run: |
          git config user.name "veille-bot"
          git config user.email "veille-bot@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet || git commit -m "data $(TZ=Europe/Paris date +%F_%H:%M)"
          git pull --rebase --quiet || true
          git push
