name: Veille Paris Tennis Padel

on:
  workflow_dispatch:   # déclenché toutes les 2 min par cron-job.org

permissions:
  contents: write      # enregistrer les données dans le dépôt
  pages: write         # publier le tableau de bord
  id-token: write

concurrency:
  group: veille
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Passage de surveillance
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          ALERTES: ${{ secrets.ALERTES }}
          SPORT: "1"
          PASSES: "1"
        run: python watcher.py

      - name: Enregistrer les données
        if: always()
        run: |
          git config user.name "veille-bot"
          git config user.email "veille-bot@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet && exit 0
          git commit -q -m "data $(TZ=Europe/Paris date +%F_%H:%M)"
          # 3 essais : si le dépôt a changé entre-temps, on récupère et nos données gagnent en cas de conflit
          for i in 1 2 3; do
            git pull -q --rebase -X theirs origin main && git push -q && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((i * 5))
          done
          echo "Enregistrement impossible après 3 essais" && exit 1

      # Publication du tableau de bord par ce workflow (plus de build Pages automatique à chaque enregistrement)
      - name: Préparer la page
        if: always()
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Publier la page
        if: always()
        id: deploy
        uses: actions/deploy-pages@v4
